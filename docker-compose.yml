version: "3"
services:
  postgres:
    image: postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - ./db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
      - ./postgres/scripts/:/docker-entrypoint-initdb.d/scripts/
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ratings"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - test-network

  library-system:
    build:
      context: .
      dockerfile: library.dockerfile
    container_name: library-system
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOCKER_CONNECTION_STRING: "Host=postgres;Port=5432;Database=libraries;Username=program;Password=test"
    networks:
      - test-network
    command: ["sh", "-c", "dotnet run /app/LibrarySystem/LibrarySystem.Web.Api/LibrarySystem.Web.Api.csproj"]
    ports:
      - "8060:8060"

  reservation-system:
    build:
      context: .
      dockerfile: reservation.dockerfile
    container_name: reservation-system
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOCKER_CONNECTION_STRING: "Host=postgres;Port=5432;Database=reservations;Username=program;Password=test"
    networks:
      - test-network
    command: ["sh", "-c", "dotnet run /app/ReservationSystem/ReservationSystem.Web.Api/ReservationSystem.Web.Api.csproj"]
    ports:
      - "8070:8070"

  rating-system:
    build:
      context: .
      dockerfile: rating.dockerfile
    container_name: rating-system
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOCKER_CONNECTION_STRING: "Host=postgres;Port=5432;Database=ratings;Username=program;Password=test"
    networks:
      - test-network
    command: ["sh", "-c", "dotnet run /app/RatingSystem/RatingSystem.Web.Api/RatingSystem.Web.Api.csproj"]
    ports:
      - "8050:8050"

  gateway-service:
    build:
      context: .
      dockerfile: gateway.dockerfile
    container_name: gateway-service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - test-network
    #command: ["sh", "-c", "dotnet run /app/GatewayService/GatewayService.Web.Api/GatewayService.Web.Api.csproj"]
    ports:
      - "8080:8080"

networks:
  test-network:
    driver: bridge